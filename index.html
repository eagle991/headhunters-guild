<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Online Next | Terminal Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050812;
            --panel-bg: #0b1120;
            --neon-cyan: #00f0ff;
            --neon-red: #ff2a2a;
            --neon-orange: #ff8c00;
            --neon-green: #00ff88;
            --text-main: #e0e6ed;
            --text-dim: #7a8b99;
            --border-color: #1f2d40;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .screen { display: none; width: 100%; max-width: 900px; padding: 20px; }
        .screen.active { display: block; }

        .terminal-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .corner { position: absolute; width: 15px; height: 15px; border-color: var(--neon-cyan); border-style: solid; border-width: 0; }
        .corner.top-left { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
        .corner.top-right { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
        .corner.bottom-left { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
        .corner.bottom-right { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-btn.active {
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .form-group { margin-bottom: 20px; position: relative; }
        label {
            display: block;
            font-size: 12px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            transition: 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.05);
        }

        select { cursor: pointer; }
        select option { background: var(--panel-bg); color: var(--text-main); }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, rgba(0,240,255,0.1), rgba(0,240,255,0.2));
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .submit-btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            color: #fff;
        }

        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .message {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            border: 1px solid transparent;
            display: none;
        }

        .message.success { display: block; color: var(--neon-green); border-color: var(--neon-green); background: rgba(0, 255, 136, 0.1); }
        .message.error { display: block; color: var(--neon-red); border-color: var(--neon-red); background: rgba(255, 42, 42, 0.1); }

        .hidden { display: none; }
        
        .loader {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
        }

        .user-info { color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; }
        .logout-btn {
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            padding: 8px 15px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(255, 42, 42, 0.2); }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            margin-bottom: 20px;
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-size: 18px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 10px;
        }

        .status-pending { background: rgba(255, 140, 0, 0.2); color: var(--neon-orange); border: 1px solid var(--neon-orange); }
        .status-approved { background: rgba(0, 255, 136, 0.2); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .status-rejected { background: rgba(255, 42, 42, 0.2); color: var(--neon-red); border: 1px solid var(--neon-red); }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .data-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .data-label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .data-value {
            font-size: 18px;
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 15px;
        }

        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .player-nick {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-size: 16px;
        }

        .action-buttons { display: flex; gap: 10px; }

        .btn-approve, .btn-reject {
            padding: 8px 15px;
            border: none;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-approve {
            background: rgba(0, 255, 136, 0.2);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
        }

        .btn-approve:hover { background: rgba(0, 255, 136, 0.4); }

        .btn-reject {
            background: rgba(255, 42, 42, 0.2);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
        }

        .btn-reject:hover { background: rgba(255, 42, 42, 0.4); }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА/РЕГИСТРАЦИИ -->
    <div id="authScreen" class="screen active">
        <div class="terminal-container">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

            <h1>RF Online</h1>
            <div class="subtitle">Система идентификации личности</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>

            <form id="loginForm" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>Позывной (Никнейм)</label>
                    <input type="text" id="loginNick" required placeholder="Введите позывной...">
                </div>
                <div class="form-group">
                    <label>Код доступа (Пароль)</label>
                    <input type="password" id="loginPass" required placeholder="Введите код...">
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Инициировать вход</button>
            </form>

            <form id="registerForm" class="hidden" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>Новый позывной</label>
                    <input type="text" id="regNick" required placeholder="Придумайте ник...">
                </div>
                <div class="form-group">
                    <label>Код доступа</label>
                    <input type="password" id="regPass" required placeholder="Придумайте пароль...">
                </div>
                <div class="form-group">
                    <label>Ключ доступа (Для Админов/Модов)</label>
                    <input type="password" id="regKey" placeholder="Оставьте пустым для роли Игрок">
                </div>
                <button type="submit" class="submit-btn" id="regBtn">Зарегистрироваться</button>
            </form>

            <div id="authMessage" class="message"></div>
        </div>
    </div>

    <!-- ЭКРАН ИГРОКА -->
    <div id="playerScreen" class="screen">
        <div class="header-bar">
            <div class="user-info">Позывной: <span id="playerNick"></span></div>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>

        <div class="panel">
            <div class="panel-title">Идентификация персонажа <span id="playerStatus"></span></div>
            
            <form id="playerDataForm" onsubmit="savePlayerData(event)">
                <div class="data-grid">
                    <div class="form-group">
                        <label>БМ (Боевая Мощь)</label>
                        <input type="number" id="bm" required placeholder="Например: 150000">
                    </div>
                    <div class="form-group">
                        <label>Уровень персонажа</label>
                        <input type="number" id="level" required placeholder="Например: 60">
                    </div>
                    <div class="form-group">
                        <label>Атака</label>
                        <input type="number" id="attack" required placeholder="Например: 5000">
                    </div>
                    <div class="form-group">
                        <label>Защита</label>
                        <input type="number" id="defense" required placeholder="Например: 3000">
                    </div>
                    <div class="form-group">
                        <label>Меткость</label>
                        <input type="number" id="accuracy" required placeholder="Например: 2000">
                    </div>
                    <div class="form-group">
                        <label>Уклонение</label>
                        <input type="number" id="evasion" required placeholder="Например: 1500">
                    </div>
                </div>
                <div class="form-group">
                    <label>Закрытые коллекции</label>
                    <input type="text" id="collections" required placeholder="Перечислите закрытые коллекции...">
                </div>
                <div class="form-group">
                    <label>Профессия</label>
                    <select id="profession" required>
                        <option value="">Выберите профессию...</option>
                        <option value="Демолишер">Демолишер</option>
                        <option value="Арбитр">Арбитр</option>
                        <option value="Каратель">Каратель</option>
                        <option value="Фантом">Фантом</option>
                        <option value="Дредноут">Дредноут</option>
                        <option value="Сайфер">Сайфер</option>
                        <option value="Техник">Техник</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="saveDataBtn">Отправить на проверку</button>
            </form>
            <div id="playerMessage" class="message"></div>
        </div>

        <div id="approvedDataPanel" class="panel hidden">
            <div class="panel-title">Подтвержденные данные</div>
            <div class="data-grid" id="approvedDataGrid"></div>
        </div>
    </div>

    <!-- ЭКРАН АДМИНА -->
    <div id="adminScreen" class="screen">
        <div class="header-bar">
            <div class="user-info">Админ-панель</div>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>

        <div class="panel">
            <div class="panel-title">Игроки на проверке</div>
            <div id="pendingPlayersList"></div>
            <div id="adminMessage" class="message"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwAFoDtQzWBZqqJ6BEGoDCLUZObhpAq9gNh6B7DCGH6Hboq87ukyPyKj_pssv74tm3U/exec';
        let currentUser = null;
        let currentRole = null;

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const msg = document.getElementById('authMessage');
            
            msg.className = 'message';
            msg.style.display = 'none';

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        }

        async function handleAuth(e, action) {
            e.preventDefault();
            const msg = document.getElementById('authMessage');
            const btn = action === 'login' ? document.getElementById('loginBtn') : document.getElementById('regBtn');
            
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="loader"></span> Обработка...';
            msg.className = 'message';
            msg.style.display = 'none';

            let payload = { action: action };

            if (action === 'login') {
                payload.nickname = document.getElementById('loginNick').value;
                payload.password = document.getElementById('loginPass').value;
            } else {
                payload.nickname = document.getElementById('regNick').value;
                payload.password = document.getElementById('regPass').value;
                payload.roleKey = document.getElementById('regKey').value;
            }

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    redirect: 'follow' 
                });
                
                const result = await response.json();

                if (result.success) {
                    msg.className = 'message success';
                    msg.innerText = result.message;
                    
                    if (action === 'login') {
                        currentUser = payload.nickname;
                        currentRole = result.role;
                        
                        setTimeout(() => {
                            if (currentRole === 'Админ') {
                                showAdminScreen();
                            } else {
                                showPlayerScreen();
                            }
                        }, 1000);
                    }
                } else {
                    msg.className = 'message error';
                    msg.innerText = result.message;
                }
            } catch (error) {
                msg.className = 'message error';
                msg.innerText = 'Ошибка связи с сервером.';
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
                msg.style.display = 'block';
            }
        }

        function showPlayerScreen() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('playerScreen').classList.add('active');
            document.getElementById('playerNick').innerText = currentUser;
            loadPlayerData();
        }

        function showAdminScreen() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('adminScreen').classList.add('active');
            loadPendingPlayers();
        }

        async function loadPlayerData() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getPlayerData', nickname: currentUser }),
                    redirect: 'follow'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    // Заполняем форму
                    document.getElementById('bm').value = data.bm || '';
                    document.getElementById('level').value = data.level || '';
                    document.getElementById('attack').value = data.attack || '';
                    document.getElementById('defense').value = data.defense || '';
                    document.getElementById('accuracy').value = data.accuracy || '';
                    document.getElementById('evasion').value = data.evasion || '';
                    document.getElementById('collections').value = data.collections || '';
                    document.getElementById('profession').value = data.profession || '';
                    
                    // Показываем статус
                    const statusSpan = document.getElementById('playerStatus');
                    if (data.status === 'pending') {
                        statusSpan.innerHTML = '<span class="status-badge status-pending">На проверке</span>';
                    } else if (data.status === 'approved') {
                        statusSpan.innerHTML = '<span class="status-badge status-approved">Подтверждено</span>';
                        showApprovedData(data);
                    } else if (data.status === 'rejected') {
                        statusSpan.innerHTML = '<span class="status-badge status-rejected">Отклонено</span>';
                    }
                }
            } catch (error) {
                console.error(error);
            }
        }

        function showApprovedData(data) {
            const panel = document.getElementById('approvedDataPanel');
            const grid = document.getElementById('approvedDataGrid');
            
            grid.innerHTML = `
                <div class="data-item"><div class="data-label">БМ</div><div class="data-value">${data.bm}</div></div>
                <div class="data-item"><div class="data-label">Уровень</div><div class="data-value">${data.level}</div></div>
                <div class="data-item"><div class="data-label">Атака</div><div class="data-value">${data.attack}</div></div>
                <div class="data-item"><div class="data-label">Защита</div><div class="data-value">${data.defense}</div></div>
                <div class="data-item"><div class="data-label">Меткость</div><div class="data-value">${data.accuracy}</div></div>
                <div class="data-item"><div class="data-label">Уклонение</div><div class="data-value">${data.evasion}</div></div>
                <div class="data-item"><div class="data-label">Закрытые коллекции</div><div class="data-value">${data.collections}</div></div>
                <div class="data-item"><div class="data-label">Профессия</div><div class="data-value">${data.profession}</div></div>
            `;
            
            panel.classList.remove('hidden');
        }

        async function savePlayerData(e) {
            e.preventDefault();
            const btn = document.getElementById('saveDataBtn');
            const msg = document.getElementById('playerMessage');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> Отправка...';
            
            const payload = {
                action: 'savePlayerData',
                nickname: currentUser,
                bm: document.getElementById('bm').value,
                level: document.getElementById('level').value,
                attack: document.getElementById('attack').value,
                defense: document.getElementById('defense').value,
                accuracy: document.getElementById('accuracy').value,
                evasion: document.getElementById('evasion').value,
                collections: document.getElementById('collections').value,
                profession: document.getElementById('profession').value
            };
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    redirect: 'follow'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    msg.className = 'message success';
                    msg.innerText = result.message;
                    setTimeout(() => loadPlayerData(), 1000);
                } else {
                    msg.className = 'message error';
                    msg.innerText = result.message;
                }
            } catch (error) {
                msg.className = 'message error';
                msg.innerText = 'Ошибка связи с сервером.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Отправить на проверку';
                msg.style.display = 'block';
            }
        }

        async function loadPendingPlayers() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getPendingPlayers' }),
                    redirect: 'follow'
                });
                
                const result = await response.json();
                const list = document.getElementById('pendingPlayersList');
                
                if (result.success && result.players.length > 0) {
                    list.innerHTML = result.players.map(player => `
                        <div class="player-card">
                            <div class="player-card-header">
                                <div class="player-nick">${player.nickname}</div>
                                <div class="action-buttons">
                                    <button class="btn-approve" onclick="approvePlayer('${player.nickname}')">Подтвердить</button>
                                    <button class="btn-reject" onclick="rejectPlayer('${player.nickname}')">Отклонить</button>
                                </div>
                            </div>
                            <div class="data-grid">
                                <div class="data-item"><div class="data-label">БМ</div><div class="data-value">${player.bm}</div></div>
                                <div class="data-item"><div class="data-label">Уровень</div><div class="data-value">${player.level}</div></div>
                                <div class="data-item"><div class="data-label">Атака</div><div class="data-value">${player.attack}</div></div>
                                <div class="data-item"><div class="data-label">Защита</div><div class="data-value">${player.defense}</div></div>
                                <div class="data-item"><div class="data-label">Меткость</div><div class="data-value">${player.accuracy}</div></div>
                                <div class="data-item"><div class="data-label">Уклонение</div><div class="data-value">${player.evasion}</div></div>
                                <div class="data-item"><div class="data-label">Коллекции</div><div class="data-value">${player.collections}</div></div>
                                <div class="data-item"><div class="data-label">Профессия</div><div class="data-value">${player.profession}</div></div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div style="text-align: center; color: var(--text-dim);">Нет игроков на проверке</div>';
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function approvePlayer(nickname) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'approvePlayer', nickname: nickname }),
                    redirect: 'follow'
                });
                
                const result = await response.json();
                const msg = document.getElementById('adminMessage');
                
                if (result.success) {
                    msg.className = 'message success';
                    msg.innerText = result.message;
                    setTimeout(() => {
                        loadPendingPlayers();
                        msg.style.display = 'none';
                    }, 1000);
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function rejectPlayer(nickname) {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'rejectPlayer', nickname: nickname }),
                    redirect: 'follow'
                });
                
                const result = await response.json();
                const msg = document.getElementById('adminMessage');
                
                if (result.success) {
                    msg.className = 'message error';
                    msg.innerText = result.message;
                    setTimeout(() => {
                        loadPendingPlayers();
                        msg.style.display = 'none';
                    }, 1000);
                }
            } catch (error) {
                console.error(error);
            }
        }

        function logout() {
            currentUser = null;
            currentRole = null;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('authScreen').classList.add('active');
        }
    </script>
</body>
</html>
