<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Online Next | Terminal Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050812;
            --panel-bg: #0b1120;
            --neon-cyan: #00f0ff;
            --neon-red: #ff2a2a;
            --neon-orange: #ff8c00;
            --text-main: #e0e6ed;
            --text-dim: #7a8b99;
            --border-color: #1f2d40;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Сетка на фоне */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .terminal-container {
            width: 100%;
            max-width: 450px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.1), inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Уголки интерфейса */
        .corner { position: absolute; width: 15px; height: 15px; border-color: var(--neon-cyan); border-style: solid; border-width: 0; }
        .corner.top-left { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
        .corner.top-right { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
        .corner.bottom-left { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
        .corner.bottom-right { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            padding: 10px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn.active {
            color: var(--neon-cyan);
            border-bottom: 2px solid var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            transition: 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.05);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, rgba(0,240,255,0.1), rgba(0,240,255,0.2));
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        }

        .submit-btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            color: #fff;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            border: 1px solid transparent;
            display: none;
        }

        .message.success {
            display: block;
            color: #00ff88;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .message.error {
            display: block;
            color: var(--neon-red);
            border-color: var(--neon-red);
            background: rgba(255, 42, 42, 0.1);
        }

        .hidden { display: none; }
        
        .loader {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <h1>RF Online</h1>
        <div class="subtitle">Система идентификации личности</div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
            <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
        </div>

        <!-- Форма Входа -->
        <form id="loginForm" onsubmit="handleAuth(event, 'login')">
            <div class="form-group">
                <label>Позывной (Никнейм)</label>
                <input type="text" id="loginNick" required placeholder="Введите позывной...">
            </div>
            <div class="form-group">
                <label>Код доступа (Пароль)</label>
                <input type="password" id="loginPass" required placeholder="Введите код...">
            </div>
            <button type="submit" class="submit-btn" id="loginBtn">Инициировать вход</button>
        </form>

        <!-- Форма Регистрации -->
        <form id="registerForm" class="hidden" onsubmit="handleAuth(event, 'register')">
            <div class="form-group">
                <label>Новый позывной</label>
                <input type="text" id="regNick" required placeholder="Придумайте ник...">
            </div>
            <div class="form-group">
                <label>Код доступа</label>
                <input type="password" id="regPass" required placeholder="Придумайте пароль...">
            </div>
            <div class="form-group">
                <label>Ключ доступа (Для Админов/Модов)</label>
                <input type="password" id="regKey" placeholder="Оставьте пустым для роли Игрок">
            </div>
            <button type="submit" class="submit-btn" id="regBtn">Зарегистрироваться</button>
        </form>

        <div id="statusMessage" class="message"></div>
    </div>

    <script>
        // ⚠️ ВСТАВЬ СЮДА ССЫЛКУ НА ТВОЙ GOOGLE APPS SCRIPT (Из Шага 2, пункт 8)
        const SCRIPT_URL = 'ВСТАВЬ_СЮДА_ССЫЛКУ_НА_APPS_SCRIPT';

        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const msg = document.getElementById('statusMessage');
            
            msg.className = 'message'; // Сброс сообщения
            msg.style.display = 'none';

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            }
        }

        async function handleAuth(e, action) {
            e.preventDefault();
            const msg = document.getElementById('statusMessage');
            const btn = action === 'login' ? document.getElementById('loginBtn') : document.getElementById('regBtn');
            
            // UI загрузка
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="loader"></span> Обработка...';
            msg.className = 'message';
            msg.style.display = 'none';

            let payload = { action: action };

            if (action === 'login') {
                payload.nickname = document.getElementById('loginNick').value;
                payload.password = document.getElementById('loginPass').value;
            } else {
                payload.nickname = document.getElementById('regNick').value;
                payload.password = document.getElementById('regPass').value;
                payload.roleKey = document.getElementById('regKey').value;
            }

            try {
                // fetch к Google Apps Script требует redirect: 'follow'
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    redirect: 'follow' 
                });
                
                const result = await response.json();

                if (result.success) {
                    msg.className = 'message success';
                    msg.innerText = result.message;
                    if (action === 'login') {
                        msg.innerText += ` | Роль: ${result.role}`;
                        // Здесь потом можно сделать редирект в личный кабинет
                    }
                } else {
                    msg.className = 'message error';
                    msg.innerText = result.message;
                }
            } catch (error) {
                msg.className = 'message error';
                msg.innerText = 'Ошибка связи с сервером. Проверьте подключение.';
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
                msg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
