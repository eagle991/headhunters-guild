<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RF Online Next | Терминал доступа</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --blur: blur(20px);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .screen { display: none; width: 100%; max-width: 1000px; padding: 20px; position: relative; z-index: 1; }
        .screen.active { display: block; }

        .terminal-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow);
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            margin-bottom: 28px;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input::placeholder { color: var(--text-muted); }

        select { cursor: pointer; }
        select option { background: #1a1f3a; color: var(--text-main); }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .submit-btn:active { transform: translateY(0); }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
        }

        .message.success {
            display: block;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .message.error {
            display: block;
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .hidden { display: none !important; }

        .loader {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--card-bg);
            backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: 16px;
        }

        .user-info {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
        }

        .user-info span {
            color: var(--primary);
            font-weight: 700;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
        }

        .panel {
            background: var(--card-bg);
            backdrop-filter: var(--blur);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 20px;
            margin-left: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-approved {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-rejected {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .data-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .data-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-size: 18px;
            color: var(--primary);
            font-weight: 700;
        }

        .player-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .player-card:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .player-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .player-nick {
            font-weight: 700;
            color: var(--primary);
            font-size: 16px;
        }

        .action-buttons { display: flex; gap: 8px; }

        .btn-approve, .btn-reject, .btn-edit, .btn-compare, .btn-back {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-approve {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .btn-approve:hover {
            background: rgba(16, 185, 129, 0.25);
            transform: translateY(-1px);
        }

        .btn-reject {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reject:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .btn-edit {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
            width: 100%;
            margin-top: 12px;
            padding: 12px;
        }

        .btn-edit:hover {
            background: rgba(99, 102, 241, 0.25);
        }

        .btn-compare {
            background: rgba(139, 92, 246, 0.15);
            color: var(--secondary);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .btn-compare:hover {
            background: rgba(139, 92, 246, 0.25);
            transform: translateY(-1px);
        }

        .btn-back {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 16px;
        }

        .btn-back:hover {
            background: rgba(99, 102, 241, 0.25);
        }

        .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: 40px 0;
            font-size: 14px;
        }

        .ranking-list { display: flex; flex-direction: column; gap: 10px; }

        .ranking-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            transform: translateX(4px);
        }

        .ranking-position {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dim);
            min-width: 50px;
            text-align: center;
        }

        .ranking-position.top-1 {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ranking-position.top-2 {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ranking-position.top-3 {
            background: linear-gradient(135deg, #cd7f32 0%, #e8a87c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ranking-info { flex: 1; }

        .ranking-nick {
            font-weight: 700;
            color: var(--text-main);
            font-size: 15px;
            margin-bottom: 4px;
        }

        .ranking-stats {
            font-size: 12px;
            color: var(--text-dim);
        }

        .ranking-bm {
            font-size: 16px;
            color: var(--success);
            font-weight: 700;
            margin-right: 12px;
        }

        .compare-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .compare-column {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
        }

        .compare-title {
            font-family: 'Poppins', sans-serif;
            color: var(--primary);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }

        .compare-stat {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .compare-stat:last-child { border-bottom: none; }

        .compare-label {
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
        }

        .compare-value {
            font-size: 15px;
            font-weight: 700;
        }

        .compare-value.better { color: var(--success); }
        .compare-value.worse { color: var(--danger); }
        .compare-value.equal { color: var(--warning); }

        @media (max-width: 768px) {
            .data-grid { grid-template-columns: 1fr; }
            .compare-container { grid-template-columns: 1fr; }
            .ranking-item { flex-wrap: wrap; }
            .ranking-bm { margin: 8px 0; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА/РЕГИСТРАЦИИ -->
    <div id="authScreen" class="screen active">
        <div class="terminal-container">
            <h1>RF Online Next</h1>
            <div class="subtitle">Терминал идентификации</div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchAuthTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">Регистрация</button>
            </div>

            <form id="loginForm" onsubmit="handleAuth(event, 'login')">
                <div class="form-group">
                    <label>Позывной</label>
                    <input type="text" id="loginNick" required placeholder="Введите никнейм">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="loginPass" required placeholder="Введите пароль">
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Войти</button>
            </form>

            <form id="registerForm" class="hidden" onsubmit="handleAuth(event, 'register')">
                <div class="form-group">
                    <label>Позывной</label>
                    <input type="text" id="regNick" required placeholder="Придумайте никнейм">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="regPass" required placeholder="Придумайте пароль">
                </div>
                <div class="form-group">
                    <label>Ключ доступа (опционально)</label>
                    <input type="password" id="regKey" placeholder="Для админов/модераторов">
                </div>
                <button type="submit" class="submit-btn" id="regBtn">Зарегистрироваться</button>
            </form>
            <div id="authMessage" class="message"></div>
        </div>
    </div>

    <!-- ЭКРАН ИГРОКА -->
    <div id="playerScreen" class="screen">
        <div class="header-bar">
            <div class="user-info">Позывной: <span id="playerNick"></span></div>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabCabinet" onclick="switchPlayerTab('cabinet')">Кабинет</button>
            <button class="tab-btn" id="tabIdentification" onclick="switchPlayerTab('identification')">Идентификация</button>
            <button class="tab-btn" id="tabPlayers" onclick="switchPlayerTab('players')">Игроки</button>
        </div>

        <div id="cabinetContent" class="panel">
            <div class="panel-title">Подтвержденные данные</div>
            <div id="approvedDataGrid" class="data-grid"></div>
            <div id="cabinetEmpty" class="empty-state hidden">Данные отсутствуют или на проверке</div>
        </div>

        <div id="identificationContent" class="panel hidden">
            <div class="panel-title">Идентификация <span id="playerStatus"></span></div>
            
            <div id="approvedMessage" class="hidden">
                <div class="message success" style="display: block; margin-bottom: 16px;">
                    Данные подтверждены администратором
                </div>
                <p style="color: var(--text-dim); text-align: center; margin-bottom: 16px; font-size: 13px;">
                    Для изменений нажмите кнопку ниже
                </p>
                <button class="btn-edit" onclick="showEditForm()">Запросить изменение</button>
            </div>

            <form id="playerDataForm" class="hidden" onsubmit="savePlayerData(event)">
                <div class="data-grid">
                    <div class="form-group"><label>БМ</label><input type="number" id="bm" required placeholder="150000"></div>
                    <div class="form-group"><label>Уровень</label><input type="number" id="level" required placeholder="60"></div>
                    <div class="form-group"><label>Атака</label><input type="number" id="attack" required placeholder="5000"></div>
                    <div class="form-group"><label>Защита</label><input type="number" id="defense" required placeholder="3000"></div>
                    <div class="form-group"><label>Меткость</label><input type="number" id="accuracy" required placeholder="2000"></div>
                    <div class="form-group"><label>Уклонение</label><input type="number" id="evasion" required placeholder="1500"></div>
                </div>
                <div class="form-group">
                    <label>Закрытые коллекции</label>
                    <input type="text" id="collections" required placeholder="Перечислите коллекции">
                </div>
                <div class="form-group">
                    <label>Профессия</label>
                    <select id="profession" required>
                        <option value="">Выберите профессию</option>
                        <option value="Демолишер">Демолишер</option>
                        <option value="Арбитр">Арбитр</option>
                        <option value="Каратель">Каратель</option>
                        <option value="Фантом">Фантом</option>
                        <option value="Дредноут">Дредноут</option>
                        <option value="Сайфер">Сайфер</option>
                        <option value="Техник">Техник</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn" id="saveDataBtn">Отправить на проверку</button>
            </form>
            <div id="playerMessage" class="message"></div>
        </div>

        <div id="playersContent" class="panel hidden">
            <div id="playersList">
                <div class="panel-title">Рейтинг игроков</div>
                <div id="rankingList" class="ranking-list"></div>
            </div>
            
            <div id="compareView" class="hidden">
                <button class="btn-back" onclick="backToRanking()">← Назад</button>
                <div class="panel-title">Сравнение</div>
                <div class="compare-container">
                    <div class="compare-column">
                        <div class="compare-title" id="myNick">Мой персонаж</div>
                        <div id="myStats"></div>
                    </div>
                    <div class="compare-column">
                        <div class="compare-title" id="compareNick">Противник</div>
                        <div id="compareStats"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН АДМИНА -->
    <div id="adminScreen" class="screen">
        <div class="header-bar">
            <div class="user-info">Админ-панель</div>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>
        <div class="panel">
            <div class="panel-title">Игроки на проверке</div>
            <div id="pendingPlayersList"></div>
            <div id="adminMessage" class="message"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxlGLrMcL-mpcyZTMBSVjK2XwVTTcdWX9hiVr-Wx3u3slWVU_blh9rRoeiZs2NdCD2X/exec';
        let currentUser = null;
        let currentRole = null;
        let myPlayerData = null;

        function switchAuthTab(tab) {
            const tabs = document.querySelectorAll('#authScreen .tab-btn');
            tabs.forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const msg = document.getElementById('authMessage');
            msg.className = 'message'; msg.style.display = 'none';
            if (tab === 'login') { loginForm.classList.remove('hidden'); registerForm.classList.add('hidden'); } 
            else { loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); }
        }

        function switchPlayerTab(tab) {
            document.getElementById('tabCabinet').classList.toggle('active', tab === 'cabinet');
            document.getElementById('tabIdentification').classList.toggle('active', tab === 'identification');
            document.getElementById('tabPlayers').classList.toggle('active', tab === 'players');
            document.getElementById('cabinetContent').classList.toggle('hidden', tab !== 'cabinet');
            document.getElementById('identificationContent').classList.toggle('hidden', tab !== 'identification');
            document.getElementById('playersContent').classList.toggle('hidden', tab !== 'players');
            
            if (tab === 'players') loadAllPlayers();
        }

        function showEditForm() {
            document.getElementById('approvedMessage').classList.add('hidden');
            document.getElementById('playerDataForm').classList.remove('hidden');
        }

        async function handleAuth(e, action) {
            e.preventDefault();
            const msg = document.getElementById('authMessage');
            const btn = action === 'login' ? document.getElementById('loginBtn') : document.getElementById('regBtn');
            btn.disabled = true;
            const originalText = btn.innerText;
            btn.innerHTML = '<span class="loader"></span> Обработка...';
            msg.className = 'message'; msg.style.display = 'none';

            let payload = { action: action };
            if (action === 'login') {
                payload.nickname = document.getElementById('loginNick').value;
                payload.password = document.getElementById('loginPass').value;
            } else {
                payload.nickname = document.getElementById('regNick').value;
                payload.password = document.getElementById('regPass').value;
                payload.roleKey = document.getElementById('regKey').value;
            }

            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
                const result = await response.json();
                if (result.success) {
                    msg.className = 'message success'; msg.innerText = result.message;
                    if (action === 'login') {
                        currentUser = payload.nickname;
                        currentRole = result.role;
                        setTimeout(() => {
                            if (currentRole === 'Админ') showAdminScreen();
                            else showPlayerScreen();
                        }, 1000);
                    }
                } else {
                    msg.className = 'message error'; msg.innerText = result.message;
                }
            } catch (error) {
                msg.className = 'message error'; msg.innerText = 'Ошибка связи с сервером';
            } finally {
                btn.disabled = false; btn.innerText = originalText; msg.style.display = 'block';
            }
        }

        function showPlayerScreen() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('playerScreen').classList.add('active');
            document.getElementById('playerNick').innerText = currentUser;
            loadPlayerData();
        }

        function showAdminScreen() {
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('adminScreen').classList.add('active');
            loadPendingPlayers();
        }

        async function loadPlayerData() {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getPlayerData', nickname: currentUser }), redirect: 'follow' });
                const result = await response.json();
                
                const form = document.getElementById('playerDataForm');
                const approvedMsg = document.getElementById('approvedMessage');
                const cabinetEmpty = document.getElementById('cabinetEmpty');
                const approvedGrid = document.getElementById('approvedDataGrid');
                const statusSpan = document.getElementById('playerStatus');

                if (result.success) {
                    const data = result.data;
                    myPlayerData = data;
                    
                    document.getElementById('bm').value = data.bm || '';
                    document.getElementById('level').value = data.level || '';
                    document.getElementById('attack').value = data.attack || '';
                    document.getElementById('defense').value = data.defense || '';
                    document.getElementById('accuracy').value = data.accuracy || '';
                    document.getElementById('evasion').value = data.evasion || '';
                    document.getElementById('collections').value = data.collections || '';
                    document.getElementById('profession').value = data.profession || '';

                    if (data.status === 'approved') {
                        statusSpan.innerHTML = '<span class="status-badge status-approved">Подтверждено</span>';
                        approvedGrid.innerHTML = `
                            <div class="data-item"><div class="data-label">БМ</div><div class="data-value">${data.bm}</div></div>
                            <div class="data-item"><div class="data-label">Уровень</div><div class="data-value">${data.level}</div></div>
                            <div class="data-item"><div class="data-label">Атака</div><div class="data-value">${data.attack}</div></div>
                            <div class="data-item"><div class="data-label">Защита</div><div class="data-value">${data.defense}</div></div>
                            <div class="data-item"><div class="data-label">Меткость</div><div class="data-value">${data.accuracy}</div></div>
                            <div class="data-item"><div class="data-label">Уклонение</div><div class="data-value">${data.evasion}</div></div>
                            <div class="data-item"><div class="data-label">Коллекции</div><div class="data-value">${data.collections}</div></div>
                            <div class="data-item"><div class="data-label">Профессия</div><div class="data-value">${data.profession}</div></div>
                        `;
                        cabinetEmpty.classList.add('hidden');
                        approvedGrid.classList.remove('hidden');
                        form.classList.add('hidden');
                        approvedMsg.classList.remove('hidden');
                        switchPlayerTab('cabinet');
                    } 
                    else if (data.status === 'pending') {
                        statusSpan.innerHTML = '<span class="status-badge status-pending">На проверке</span>';
                        cabinetEmpty.classList.remove('hidden');
                        approvedGrid.classList.add('hidden');
                        approvedMsg.classList.add('hidden');
                        form.classList.remove('hidden');
                        switchPlayerTab('identification');
                    } 
                    else {
                        statusSpan.innerHTML = '<span class="status-badge status-rejected">Отклонено</span>';
                        cabinetEmpty.classList.remove('hidden');
                        approvedGrid.classList.add('hidden');
                        approvedMsg.classList.add('hidden');
                        form.classList.remove('hidden');
                        switchPlayerTab('identification');
                    }
                } else {
                    cabinetEmpty.classList.remove('hidden');
                    approvedGrid.classList.add('hidden');
                    approvedMsg.classList.add('hidden');
                    form.classList.remove('hidden');
                    switchPlayerTab('identification');
                }
            } catch (error) { console.error(error); }
        }

        async function savePlayerData(e) {
            e.preventDefault();
            const btn = document.getElementById('saveDataBtn');
            const msg = document.getElementById('playerMessage');
            btn.disabled = true; btn.innerHTML = '<span class="loader"></span> Отправка...';
            
            const payload = {
                action: 'savePlayerData', nickname: currentUser,
                bm: document.getElementById('bm').value, level: document.getElementById('level').value,
                attack: document.getElementById('attack').value, defense: document.getElementById('defense').value,
                accuracy: document.getElementById('accuracy').value, evasion: document.getElementById('evasion').value,
                collections: document.getElementById('collections').value, profession: document.getElementById('profession').value
            };
            
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), redirect: 'follow' });
                const result = await response.json();
                if (result.success) {
                    msg.className = 'message success'; msg.innerText = result.message;
                    setTimeout(() => loadPlayerData(), 1500);
                } else {
                    msg.className = 'message error'; msg.innerText = result.message;
                }
            } catch (error) {
                msg.className = 'message error'; msg.innerText = 'Ошибка связи с сервером';
            } finally {
                btn.disabled = false; btn.innerText = 'Отправить на проверку'; msg.style.display = 'block';
            }
        }

        async function loadPendingPlayers() {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getPendingPlayers' }), redirect: 'follow' });
                const result = await response.json();
                const list = document.getElementById('pendingPlayersList');
                if (result.success && result.players.length > 0) {
                    list.innerHTML = result.players.map(player => `
                        <div class="player-card">
                            <div class="player-card-header">
                                <div class="player-nick">${player.nickname}</div>
                                <div class="action-buttons">
                                    <button class="btn-approve" onclick="approvePlayer('${player.nickname}')">✓</button>
                                    <button class="btn-reject" onclick="rejectPlayer('${player.nickname}')">✗</button>
                                </div>
                            </div>
                            <div class="data-grid">
                                <div class="data-item"><div class="data-label">БМ</div><div class="data-value">${player.bm}</div></div>
                                <div class="data-item"><div class="data-label">Уровень</div><div class="data-value">${player.level}</div></div>
                                <div class="data-item"><div class="data-label">Атака</div><div class="data-value">${player.attack}</div></div>
                                <div class="data-item"><div class="data-label">Защита</div><div class="data-value">${player.defense}</div></div>
                                <div class="data-item"><div class="data-label">Меткость</div><div class="data-value">${player.accuracy}</div></div>
                                <div class="data-item"><div class="data-label">Уклонение</div><div class="data-value">${player.evasion}</div></div>
                                <div class="data-item"><div class="data-label">Коллекции</div><div class="data-value">${player.collections}</div></div>
                                <div class="data-item"><div class="data-label">Профессия</div><div class="data-value">${player.profession}</div></div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">Нет игроков на проверке</div>';
                }
            } catch (error) { console.error(error); }
        }

        async function approvePlayer(nickname) {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'approvePlayer', nickname: nickname }), redirect: 'follow' });
                const result = await response.json();
                const msg = document.getElementById('adminMessage');
                if (result.success) {
                    msg.className = 'message success'; msg.innerText = result.message;
                    setTimeout(() => { loadPendingPlayers(); msg.style.display = 'none'; }, 1000);
                }
            } catch (error) { console.error(error); }
        }

        async function rejectPlayer(nickname) {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'rejectPlayer', nickname: nickname }), redirect: 'follow' });
                const result = await response.json();
                const msg = document.getElementById('adminMessage');
                if (result.success) {
                    msg.className = 'message error'; msg.innerText = result.message;
                    setTimeout(() => { loadPendingPlayers(); msg.style.display = 'none'; }, 1000);
                }
            } catch (error) { console.error(error); }
        }

        async function loadAllPlayers() {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllPlayers' }), redirect: 'follow' });
                const result = await response.json();
                const list = document.getElementById('rankingList');
                
                if (result.success && result.players.length > 0) {
                    list.innerHTML = result.players.map((player, index) => {
                        const position = index + 1;
                        let positionClass = '';
                        if (position === 1) positionClass = 'top-1';
                        else if (position === 2) positionClass = 'top-2';
                        else if (position === 3) positionClass = 'top-3';
                        
                        return `
                            <div class="ranking-item">
                                <div class="ranking-position ${positionClass}">#${position}</div>
                                <div class="ranking-info">
                                    <div class="ranking-nick">${player.nickname}</div>
                                    <div class="ranking-stats">
                                        Ур. ${player.level} | ${player.profession}
                                    </div>
                                </div>
                                <div class="ranking-bm">БМ: ${player.bm}</div>
                                <button class="btn-compare" onclick="compareWithPlayer('${player.nickname}')">Сравнить</button>
                            </div>
                        `;
                    }).join('');
                } else {
                    list.innerHTML = '<div class="empty-state">Нет игроков с подтвержденными данными</div>';
                }
            } catch (error) { console.error(error); }
        }

        async function compareWithPlayer(nickname) {
            try {
                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getPlayerForCompare', nickname: nickname }), redirect: 'follow' });
                const result = await response.json();
                
                if (result.success && myPlayerData && myPlayerData.status === 'approved') {
                    document.getElementById('playersList').classList.add('hidden');
                    document.getElementById('compareView').classList.remove('hidden');
                    
                    document.getElementById('myNick').innerText = currentUser;
                    document.getElementById('compareNick').innerText = result.data.nickname;
                    
                    const myStats = document.getElementById('myStats');
                    const compareStats = document.getElementById('compareStats');
                    
                    const stats = [
                        { label: 'БМ', my: myPlayerData.bm, other: result.data.bm },
                        { label: 'Уровень', my: myPlayerData.level, other: result.data.level },
                        { label: 'Атака', my: myPlayerData.attack, other: result.data.attack },
                        { label: 'Защита', my: myPlayerData.defense, other: result.data.defense },
                        { label: 'Меткость', my: myPlayerData.accuracy, other: result.data.accuracy },
                        { label: 'Уклонение', my: myPlayerData.evasion, other: result.data.evasion }
                    ];
                    
                    myStats.innerHTML = stats.map(stat => {
                        let className = 'equal';
                        if (Number(stat.my) > Number(stat.other)) className = 'better';
                        else if (Number(stat.my) < Number(stat.other)) className = 'worse';
                        
                        return `<div class="compare-stat"><span class="compare-label">${stat.label}</span><span class="compare-value ${className}">${stat.my}</span></div>`;
                    }).join('') + `<div class="compare-stat"><span class="compare-label">Коллекции</span><span class="compare-value equal">${myPlayerData.collections}</span></div>`;
                    
                    compareStats.innerHTML = stats.map(stat => {
                        let className = 'equal';
                        if (Number(stat.other) > Number(stat.my)) className = 'better';
                        else if (Number(stat.other) < Number(stat.my)) className = 'worse';
                        
                        return `<div class="compare-stat"><span class="compare-label">${stat.label}</span><span class="compare-value ${className}">${stat.other}</span></div>`;
                    }).join('') + `<div class="compare-stat"><span class="compare-label">Коллекции</span><span class="compare-value equal">${result.data.collections}</span></div>`;
                }
            } catch (error) { console.error(error); }
        }

        function backToRanking() {
            document.getElementById('playersList').classList.remove('hidden');
            document.getElementById('compareView').classList.add('hidden');
        }

        function logout() {
            currentUser = null; currentRole = null; myPlayerData = null;
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('authScreen').classList.add('active');
            document.getElementById('authMessage').style.display = 'none';
        }
    </script>
</body>
</html>
